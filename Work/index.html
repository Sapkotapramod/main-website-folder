<style>
:root {
    --bg-color: #0d0f12;
    --paper-card: #14181f;
    --border-gold: #c5a059;
    --border-subtle: rgba(197, 160, 89, 0.25);
    --text-primary: #f2ebd9;
    --text-muted: #a3a8b2;
    --accent-gold: #d4af37;
}

.light {
    --bg-color: #f7f5f0;
    --paper-card: #ffffff;
    --border-gold: #9e7b3b;
    --border-subtle: rgba(158, 123, 59, 0.25);
    --text-primary: #1c1d1f;
    --text-muted: #5e626a;
    --accent-gold: #8c6d31;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

body {
    background-color: var(--bg-color);
    color: var(--text-primary);
    font-family: 'Source Sans 10', Georgia, serif;
    line-height: 1.7;
    transition: background-color 0.4s ease, color 0.4s ease;
}

h1, h2, h3, .brand {
    font-family: 'Cinzel', serif;
    letter-spacing: 1px;
}

.serif-italic {
    font-family: 'Playfair Display', serif;
    font-style: italic;
}

/* Header & Navigation */
header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg-color);
    border-bottom: 1px solid var(--border-subtle);
}

nav {
    max-width: 1100px;
    margin: auto;
    padding: 25px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.brand {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent-gold);
    text-transform: uppercase;
    text-decoration: none;
    letter-spacing: 2px;
}

nav ul {
    display: flex;
    gap: 35px;
    list-style: none;
}

nav a {
    color: var(--text-primary);
    text-decoration: none;
    font-size: 14px;
    font-family: 'Cinzel', serif;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: color 0.3s;
}

nav a:hover {
    color: var(--accent-gold);
}

.nav-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.toggle-theme {
    background: transparent;
    border: 1px solid var(--border-subtle);
    color: var(--accent-gold);
    padding: 8px 16px;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 1px;
    transition: 0.3s;
}

.toggle-theme:hover {
    border-color: var(--accent-gold);
}

/* Hamburger button (hidden on desktop) */
.menu-toggle {
    display: none;
    background: transparent;
    border: 1px solid var(--border-subtle);
    color: var(--accent-gold);
    width: 42px;
    height: 36px;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    transition: 0.3s;
}

.menu-toggle:hover {
    border-color: var(--accent-gold);
}

/* Hero Section */
.hero {
    max-width: 1000px;
    margin: 100px auto 80px;
    padding: 0 20px;
    text-align: center;
}

.hero-subtitle {
    font-family: 'Cinzel', serif;
    color: var(--accent-gold);
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 15px;
}

.hero h1 {
    font-size: 52px;
    font-weight: 600;
    line-height: 1.25;
    margin-bottom: 25px;
}

.divider {
    width: 80px;
    height: 2px;
    background: var(--accent-gold);
    margin: 30px auto;
}

.hero p {
    font-size: 20px;
    color: var(--text-muted);
    max-width: 720px;
    margin: 0 auto 40px;
}

.btn-classic {
    display: inline-block;
    padding: 14px 32px;
    border: 1px solid var(--accent-gold);
    color: var(--accent-gold);
    text-decoration: none;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.3s ease;
    background: transparent;
    cursor: pointer;
    text-align: center;
}

.btn-classic:hover {
    background: var(--accent-gold);
    color: var(--bg-color);
}

/* Sections */
section {
    max-width: 1000px;
    margin: 100px auto;
    padding: 0 20px;
}

.section-header {
    text-align: center;
    margin-bottom: 60px;
}

.section-header h2 {
    font-size: 32px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
}

.grid-3 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 30px;
}

.classic-card {
    background: var(--paper-card);
    border: 1px solid var(--border-subtle);
    padding: 40px 30px;
    transition: border-color 0.3s;
}

.classic-card:hover {
    border-color: var(--accent-gold);
}

.classic-card h3 {
    font-size: 20px;
    margin-bottom: 15px;
    color: var(--accent-gold);
}

.classic-card p {
    color: var(--text-muted);
    font-size: 15px;
}

/* Contact Form */
.contact-form {
    background: var(--paper-card);
    border: 1px solid var(--border-subtle);
    padding: 40px;
}

.form-group {
    margin-bottom: 25px;
}

.form-group label {
    display: block;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 1px;
    margin-bottom: 8px;
    color: var(--accent-gold);
    text-transform: uppercase;
}

input, textarea {
    width: 100%;
    padding: 12px 15px;
    background: transparent;
    border: 1px solid var(--border-subtle);
    color: var(--text-primary);
    font-family: 'Source Sans 10', serif;
    font-size: 16px; /* 16px prevents iOS zoom on focus */
    outline: none;
    transition: border-color 0.3s;
}

input:focus, textarea:focus {
    border-color: var(--accent-gold);
}

textarea {
    height: 130px;
    resize: vertical;
}

#form-status {
    margin-top: 15px;
    font-size: 14px;
    text-align: center;
    font-family: 'Cinzel', serif;
}

.link-container {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid var(--border-subtle);
    text-align: center;
}

.link-container p {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 12px;
    font-family: 'Cinzel', serif;
    letter-spacing: 1px;
}

footer {
    border-top: 1px solid var(--border-subtle);
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 13px;
    font-family: 'Cinzel', serif;
    letter-spacing: 1px;
}

/* ---------- Mobile ---------- */
@media (max-width: 768px) {
    nav {
        padding: 18px 20px;
        flex-wrap: wrap;
    }

    .brand {
        font-size: 17px;
        letter-spacing: 1px;
    }

    .menu-toggle {
        display: inline-block;
    }

    /* Menu is now a dropdown instead of being hidden */
    nav ul {
        display: none;
        flex-direction: column;
        gap: 0;
        width: 100%;
        order: 3;
        margin-top: 10px;
        border-top: 1px solid var(--border-subtle);
    }

    nav ul.open {
        display: flex;
    }

    nav ul li {
        border-bottom: 1px solid var(--border-subtle);
    }

    nav ul li:last-child {
        border-bottom: none;
    }

    nav ul a {
        display: block;
        padding: 16px 4px;
        font-size: 14px;
    }

    .hero { margin: 60px auto 50px; }
    .hero h1 { font-size: 34px; }
    .hero p { font-size: 17px; }

    section { margin: 60px auto; }
    .section-header { margin-bottom: 40px; }
    .section-header h2 { font-size: 26px; }

    .grid-2 { grid-template-columns: 1fr; gap: 30px; }
    .grid-3 { grid-template-columns: 1fr; }

    .classic-card { padding: 30px 22px; }
    .contact-form { padding: 28px 20px; }
}

@media (max-width: 380px) {
    .brand { font-size: 15px; }
    .toggle-theme { padding: 8px 10px; }
}
</style>
</head>

                <i class="fa-solid fa-bars"></i>

    </nav>

    <div class="hero">
        <p
